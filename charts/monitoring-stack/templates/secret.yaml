apiVersion: v1
kind: Secret
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-secret
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  GENERIC_API_KEY: "{{ .Values.secret.GENERIC_API_KEY | default "" }}"
  # Add other secret keys by extending values.secret.*
  # For production, provide secrets using sealed-secrets / external secret store
