receivers:
  otlp:
    protocols:
      grpc:
      http:

  jaeger:
    protocols:
      thrift_http:

  prometheus:
    config:
      scrape_configs:
        - job_name: "otel-collector-self"
          scrape_interval: 10s
          static_configs:
            - targets: ["0.0.0.0:8888"]

processors:
  batch:
  memory_limiter:
    check_interval: 5s
    limit_mib: 3000
    spike_limit_mib: 512

exporters:
  debug:
    verbosity: detailed

  otlp:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed

  pipelines:
    traces:
      receivers: [otlp, jaeger]
      processors: [memory_limiter, batch]
      exporters: [otlp, debug]

    metrics:
      receivers: [prometheus, otlp]
      processors: [batch]
      exporters: [debug]
