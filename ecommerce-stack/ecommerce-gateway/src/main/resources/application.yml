server:
  port: 8080

services:
  product: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  inventory: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  cart: ${CART_SERVICE_URL:http://localhost:8083}
  order: ${ORDER_SERVICE_URL:http://localhost:8084}
  payment: ${PAYMENT_SERVICE_URL:http://localhost:8085}
  notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      default:
        register-health-indicator: true
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 4s

  timelimiter:
    instances:
      default:
        timeout-duration: 5s

  retry:
    instances:
      default:
        max-attempts: 3
        wait-duration: 200ms