spring:
  application:
    name: inventory-service

  # --- Configuração do Banco de Dados (DB) ---
  datasource:
    url: jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    platform: h2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  # --- Configuração do Kafka (Comunicação Assíncrona) ---
  kafka:
    # Endereço dos servidores Kafka (Usado no código)
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    
    # Configurações do Consumidor (Consumer) - Mínimas necessárias para o código
    consumer:
      # Grupo de consumidores (Usado no código)
      group-id: inventory-service-group
      auto-offset-reset: earliest

    # Configurações do Produtor (Producer) - Mantidas, pois o código não as customizou
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jackson:
    serialization:
      INDENT_OUTPUT: true

server:
  port: 8082
  

logging:
  level:
    root: INFO
    org.springframework.kafka: INFO
    io.viana.inventory_service: DEBUG