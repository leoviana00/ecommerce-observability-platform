version: "3.9"

# ============================================================
# REDE COMPARTILHADA ENTRE INFRA E MICROSERVIÇOS
# ============================================================
networks:
  ecommerce-net:
    driver: bridge

services:

  # ============================================================
  # ZOOKEEPER – Necessário para o Kafka (modo ZooKeeper)
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    networks:
      - ecommerce-net

    # Verifica se a porta 2181 está aberta
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # KAFKA – Broker principal
  #
  # Configurado com dois listeners:
  #   PLAINTEXT → uso interno entre containers (kafka:9092)
  #   EXTERNAL  → anunciado como localhost:9092 (via HAProxy)
  #
  # Dessa forma:
  #   - Os serviços no Docker usam kafka:9092
  #   - Você, na sua máquina, usa localhost:9092
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka

    depends_on:
      - zookeeper

    environment:
      # ID do broker
      KAFKA_BROKER_ID: 1

      # Conexão com o Zookeeper
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Listeners disponíveis
      # 1) PLAINTEXT: acessível para outros containers via kafka:9092
      # 2) EXTERNAL: acessível externamente, mas será mapeado via HAProxy
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093

      # Endereços anunciados
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092

      # Mapeamento dos protocolos
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Comunicação entre brokers
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Fatores de replicação mínimos (ambiente single-node)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    # ports:
      # - "9092:9092" # Listener interno exposto para host (caso queira testar sem proxy)
      # - "9093:9093" # Listener EXTERNAL (não usado diretamente)

    # volumes:
    #   - kafka-data:/var/lib/kafka/data

    networks:
      - ecommerce-net

    # Verifica se o Kafka está aceitando conexões
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ============================================================
  # HAProxy – Faz proxy reverso do Kafka
  #
  # Objetivo:
  #   - Garantir que *localhost:9092* funcione tanto para Docker
  #     quanto para os serviços rodando no host.
  # ============================================================
  haproxy:
    image: haproxy:2.8
    container_name: haproxy

    depends_on:
      - kafka

    # Expondo Kafka via HAProxy
    ports:
      - "9092:9092"
      - "81:81"

    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    networks:
      - ecommerce-net

    # Verifica se o HAProxy está escutando a porta 9092
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Kafka UI – Interface gráfica para visualizar tópicos, lags, offsets etc.
  # ============================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    depends_on:
      - kafka

    ports:
      - "8088:8080" # Interface web

    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

    networks:
      - ecommerce-net

# Persistência local do Kafka
# volumes:
#   kafka-data:
