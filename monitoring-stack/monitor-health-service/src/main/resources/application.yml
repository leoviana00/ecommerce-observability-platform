spring:
  application:
    name: monitor-health-service

  # Expor métricas e health para Prometheus/Grafana
  management:
    endpoints:
      web:
        exposure:
          include: "health,info,metrics,prometheus"

monitor:
  local-json-path: ${MONITOR_LOCAL_JSON_PATH:./src/main/resources/config/health-targets.json}
  default-timeout-ms: 2000
  refresh-interval-seconds: 300

  # Novo: intervalo dos health checks em segundos
  health-check-interval-seconds: 30

  # Novo: URL base do monitor-state-manager
  state-manager-url: ${STATE_MANAGER_URL:http://localhost:8090}

  # Novo: configuração do pool de threads para health checks
  health-check-thread-pool:
    core-size: 4
    max-size: 16
    queue-capacity: 100

logging:
  level:
    root: INFO
    io.viana.monitor_health_service: DEBUG

server:
  port: 8091